# GENERAL #
###########
shell zsh
# editor /usr/local/bin/nvim
editor /opt/homebrew/bin/nvim
copy_on_select    yes
enable_audio_bell no
shell_integration enabled
# startup_session ~/.config/kitty/startup.conf

repaint_delay   10
input_delay     3
sync_to_monitor yes
mouse_hide_wait 3.0

# FONT
font_size         16.0
font_family       family="SFMono Nerd Font"
bold_font         auto
italic_font       auto
bold_italic_font  auto
disable_ligatures cursor

# APPEARANCE
hide_window_decorations titlebar_and_corners
background_opacity 1.00
dynamic_background_opacity yes
window_margin_width 1
single_window_margin_width 0
window_border_width 1pt

# LAYOUT
remember_window_size  no
initial_window_width  1485
initial_window_height 810
window_padding_width 1

# scrollback buffer
scrollback_lines 5000
scrollback_indicator_opacity 1.0
touch_scroll_multiplier 1.0

scrollbar_gap 0.5

background #282727
foreground #DDDDDD
selection_background #282727
selection_foreground #DDDDDD
url_color #72A7BC
cursor #c5c9c5

# TAB BAR #
tab_switch_strategy previous

tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_margin_width 0.0
tab_bar_margin_height 2.0 2.0

tab_bar_style powerline
tab_powerline_style slanted

# tab_bar_style separator
# tab_separator "|"

# tab_title_max_length 12
tab_title_template "{fmt.fg.tab}{activity_symbol}{title} {fmt.fg.white}"
  #AND {fmt.fg.red}{bell_symbol}{activity_symbol}
# tab_bar_background none
active_tab_font_style   bold
inactive_tab_font_style italic
tab_bar_margin_width 1
tab_bar_margin_height 0 1
tab_bar_margin_color #282727

tab_bar_margin_color #282727

tab_activity_symbol ⏲

# Tabs
active_tab_background #282727
active_tab_foreground #EEEEEE
inactive_tab_background  #181616
inactive_tab_foreground #c5c9c5
tab_bar_background #1D1C19

# normal
color0 #090618
color1 #E82424
color2 #76946A
color3 #C0A36E
color4 #7E9CD8
color5 #957FB8
color6 #6A9589
color7 #C8C093

# bright
color8  #727169
color9  #E82424
color10 #98BB6C
color11 #E6C384
color12 #7FB4CA
color13 #938AA9
color14 #7AA89F
color15 #DCD7BA


# extended colors
color16 #FFA066
color17 #FF5D62
  

# KEYBINDINGS
# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right
# All possible modifiers: cmd, alt, ctrl, shift
