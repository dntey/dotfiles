# ~/.config/yazi/yazi.toml

[mgr]
# linemode = "size"
linemode = "size_and_mtime"
ratio = [0, 5, 5]
sort_by = "natural"

[preview]
tab_size        = 2
max_width       = 2400
max_height      = 3600
image_quality   = 75

[opener]
emacs = [
  { run = "emacsclient -c %s", orphan = true, desc = "Emacs client" },
]
vim = [
  { run = "nvim %s", block = true, desc = "neovim" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = [ "emacs", "vim" ] },
]